backend:
  name: git-gateway
  branch: main

locale: nb_NO

media_folder: images/uploads
public_folder: /images/uploads

collections:

  # ── Oppdateringer & Nyheter ────────────────────────────────
  - name: oppdateringer
    label: "Oppdateringer"
    description: "Legg til nyheter, nye bøker, LEGO-sett og events. Vises på Oppdateringer-siden."
    files:
      - name: alle
        label: "Alle oppdateringer"
        file: data/oppdateringer.json
        format: json
        fields:
          - name: entries
            label: Oppdateringer
            label_singular: Oppdatering
            widget: list
            summary: "{{fields.tittel}} — {{fields.dato}}"
            fields:
              - { label: Tittel,    name: tittel,    widget: string }
              - label: Dato
                name: dato
                widget: datetime
                format: YYYY-MM-DD
                date_format: DD.MM.YYYY
                time_format: false
              - label: Kategori
                name: kategori
                widget: select
                options: [Bøker, LEGO, Event, Annet]
              - { label: Tekst,    name: tekst,    widget: text }
              - label: Bilde
                name: bilde
                widget: image
                required: false
                hint: "Valgfritt – last opp et bilde for oppdateringen"

  # ── Nyeste i butikken ──────────────────────────────────────
  - name: produkter
    label: "Nyeste i butikken"
    description: "Varer som vises på forsiden under «Nyeste i butikken». Maks 4 vises av gangen."
    files:
      - name: alle
        label: "Alle varer / funn"
        file: data/produkter.json
        format: json
        fields:
          - name: entries
            label: Varer
            label_singular: Vare
            widget: list
            summary: "{{fields.navn}} ({{fields.kategori}})"
            fields:
              - { label: Navn,         name: navn,         widget: string }
              - label: Kategori
                name: kategori
                widget: select
                options: [Bøker, Manga, LEGO, Brettspill, Samleartikler, Annet]
              - { label: Beskrivelse,  name: beskrivelse,  widget: text,  required: false }
              - label: Bilde
                name: bilde
                widget: image
                required: false

  # ── Innstillinger ──────────────────────────────────────────
  - name: innstillinger
    label: "Innstillinger"
    description: "Åpningstider og kontaktinformasjon. Endringer vises automatisk på Kontakt-siden."
    files:
      - name: kontakt
        label: "Kontaktinfo & Åpningstider"
        file: data/innstillinger.json
        format: json
        fields:
          - { label: Adresse,      name: adresse,  widget: string }
          - { label: Telefon,      name: telefon,  widget: string, hint: "Eksempel: 77 68 69 74" }
          - { label: "E-post",     name: epost,    widget: string }
          - { label: "Facebook URL", name: facebook, widget: string, required: false }
          - name: aapningstider
            label: Åpningstider
            widget: list
            fields:
              - { label: Dag,    name: dag,    widget: string, hint: "Mandag, Tirsdag, osv." }
              - { label: Tid,    name: tid,    widget: string, hint: "Eksempel: 10:00 – 17:00" }
              - { label: Stengt, name: stengt, widget: boolean, default: false }
