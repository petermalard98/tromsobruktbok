media:
  input: images/uploads
  output: images/uploads

content:

  # ── Oppdateringer & Nyheter ────────────────────────────────
  - name: oppdateringer
    label: Oppdateringer
    description: "Legg til nyheter, nye bøker, LEGO-sett og events. Vises på Oppdateringer-siden."
    type: file
    path: data/oppdateringer.json
    fields:
      - name: entries
        label: Oppdateringer
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{tittel}"
        fields:
          - name: tittel
            label: Tittel
            type: string
          - name: dato
            label: Dato
            type: date
            options:
              format: YYYY-MM-DD
          - name: kategori
            label: Kategori
            type: select
            options:
              values: [Bøker, LEGO, Event, Annet]
          - name: tekst
            label: Tekst
            type: text
          - name: bilde
            label: Bilde
            type: image
            required: false

  # ── Nyeste i butikken ──────────────────────────────────────
  - name: produkter
    label: Nyeste i butikken
    description: "Varer som vises på forsiden under «Nyeste i butikken». Maks 4 vises av gangen."
    type: file
    path: data/produkter.json
    fields:
      - name: entries
        label: Varer
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{navn}"
        fields:
          - name: navn
            label: Navn
            type: string
          - name: kategori
            label: Kategori
            type: select
            options:
              values: [Bøker, Manga, LEGO, Brettspill, Samleartikler, Annet]
          - name: beskrivelse
            label: Beskrivelse
            type: text
            required: false
          - name: bilde
            label: Bilde
            type: image
            required: false

  # ── Innstillinger ──────────────────────────────────────────
  - name: innstillinger
    label: Innstillinger
    description: "Åpningstider og kontaktinformasjon. Endringer vises automatisk på Kontakt-siden."
    type: file
    path: data/innstillinger.json
    fields:
      - name: adresse
        label: Adresse
        type: string
      - name: telefon
        label: Telefon
        type: string
      - name: epost
        label: E-post
        type: string
      - name: facebook
        label: Facebook URL
        type: string
        required: false
      - name: aapningstider_tekst
        label: Åpningstider
        description: "Skriv åpningstidene fritt, én linje per dag. F.eks: Man–fre: 10–17"
        type: text

  # ── Legoloftet ────────────────────────────────────────────
  - name: legoloftet
    label: Legoloftet
    description: "Innhold på Legoloftet-siden: introduksjon, kategorier, galleri, sitater og besøkstips."
    type: file
    path: data/legoloftet.json
    fields:
      - name: intro_overskrift
        label: Overskrift
        type: string
      - name: intro_tekst
        label: Introduksjonstekst
        type: text
      - name: kategorier
        label: Kategorier
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{navn}"
        fields:
          - name: navn
            label: Navn
            type: string
          - name: beskrivelse
            label: Beskrivelse
            type: text
      - name: galleri
        label: Galleri
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: bilde
            label: Bilde
            type: image
          - name: alt
            label: Alt-tekst
            type: string

  # ── Forside ────────────────────────────────────────────────
  - name: forside
    label: Forside
    description: "Hero-tekst, Om oss og galleribilder på forsiden."
    type: file
    path: data/forside.json
    fields:
      - name: hero_overskrift
        label: Hero – hovedoverskrift
        type: string
      - name: hero_undertekst
        label: Hero – undertekst
        type: text
      - name: om_oss
        label: Om oss
        type: text
      - name: galleri
        label: Galleri – bilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: bilde
            label: Bilde
            type: image
          - name: alt
            label: Alt-tekst
            type: string

  # ── Butikken ───────────────────────────────────────────────
  - name: butikken
    label: Butikken
    description: "Kategorier og galleribilder på Butikken-siden."
    type: file
    path: data/butikken.json
    fields:
      - name: kategorier
        label: Kategorier
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{navn}"
        fields:
          - name: navn
            label: Navn
            type: string
          - name: beskrivelse
            label: Beskrivelse
            type: text
      - name: galleri
        label: Galleri – bilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: bilde
            label: Bilde
            type: image
          - name: alt
            label: Alt-tekst
            type: string
